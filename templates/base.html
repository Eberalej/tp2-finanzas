<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Mis finanzas{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Mis finanzas</h1>
        <nav>
            {% if session.get("usuario_id") %}
            <a href="{{ url_for('panel') }}">Panel</a>
            <a href="{{ url_for('movimientos') }}">Movimientos</a>
            <a href="{{ url_for('nuevo_movimiento') }}">Cargar movimiento</a>
            <a href="{{ url_for('logout') }}">Cerrar sesión</a>
            {% else %}
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
            <a href="{{ url_for('registro') }}">Registrarme</a>
            {% endif %}
        </nav>

    </header>

    <main>
        {% for mensaje in get_flashed_messages() %}
            <p><strong>{{ mensaje }}</strong></p>
        {% endfor %}

        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
